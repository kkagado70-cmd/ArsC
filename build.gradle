plugins {
    id 'fabric-loom' version '1.8.11'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Configuração explícita do JAR
jar {
    from sourceSets.main.output   // inclui as classes compiladas
    from sourceSets.main.resources // inclui os recursos
    manifest {
        attributes 'Implementation-Title': project.name,
                   'Implementation-Version': project.version,
                   'Main-Class': null // não é necessário para mod
    }
    // Garante que o JAR não fique vazio
    doFirst {
        println "Including classes from: ${sourceSets.main.output.classesDirs}"
        println "Including resources from: ${sourceSets.main.output.resourcesDir}"
    }
}

// Para garantir que o JAR seja gerado após a compilação
tasks.build.dependsOn tasks.jar
