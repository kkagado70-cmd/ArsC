plugins {
    id 'fabric-loom' version '1.8.11'
    id 'maven-publish'
}

ext {
    mod_version = project.hasProperty('mod_version') ? project.mod_version : '1.0.2'
    maven_group = project.hasProperty('maven_group') ? project.maven_group : 'com.scale'
    archives_base_name = project.hasProperty('archives_base_name') ? project.archives_base_name : 'precise-gui-scale'
    minecraft_version = project.hasProperty('minecraft_version') ? project.minecraft_version : '1.21.11'
    loader_version = project.hasProperty('loader_version') ? project.loader_version : '0.18.4'
    fabric_version = project.hasProperty('fabric_version') ? project.fabric_version : '0.112.0+1.21.11'
    cloth_config_version = project.hasProperty('cloth_config_version') ? project.cloth_config_version : '15.0.130'
    modmenu_version = project.hasProperty('modmenu_version') ? project.modmenu_version : '12.0.0-beta.1'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}
